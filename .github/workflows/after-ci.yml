name: After CI
run-name: Nach CI-Run ${{ github.event.workflow_run.run_number }} (${{ github.event.workflow_run.conclusion }})

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

permissions: {}

jobs:
    inspect:
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'
        permissions:
            actions: read
        steps:
            - name: Download artifact
              id: download
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
              with:
                name: jar-file
                path: ${{ runner.temp }}/jar
                github-token: ${{ secrets.GITHUB_TOKEN }}
                run-id: ${{ github.event.workflow_run.workflow_id }}
            - name: Write to summary
              env:
                JARPATH: ${{ steps.download.outputs.download-path }}/greeter.jar
                CI_SHA: ${{ github.event.workflow_run.head_sha }}
                CI_EVENT: ${{ github.event.workflow_run.event }}
              run: |
                {
                    echo "| Wert | Inhalt |"
                    echo "| ---- | ------ |"
                    echo "| Größe JAR | $(stat -c %s "$JAR") Byte |"
                    echo "| Event des CI-Runs | $CI_EVENT |"
                    echo "| github.sha | $GITHUB_SHA |"
                    echo "| workflow_run.head_sha | $CI_SHA |"
                } >> "$GITHUB_STEP_SUMMARY"
