name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build:
    name: My CI job
    runs-on: [ubuntu-latest]
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Get version
        id: get-version
        run: |
          VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::greeter $VERSION gebaut"
      - name: Upload artefact
        id: upload-artefact
        uses: actions/upload-artifact@v7
        with:
          name: jar-file
          path: target/greeter.jar
          retention-days: 5
  summary:
    needs: build
    name: Summary
    runs-on: [ubuntu-latest]
    steps:
      - name: Download artefact
        id: download-artefact
        uses: actions/download-artifact@v8
        with:
          name: jar-file
      - name: Write summary
        id: write-summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          { 
            echo "Summary of the job"
            echo ""
            echo "| Variable | Wert |"
            echo "| -------- | ---- |"
            echo "| Version  | $VERSION |"
            echo "| Größe    | $(stat -c %s greeter.jar) |" 
          } >> "$GITHUB_STEP_SUMMARY"
  docker:
    needs: build
    name: Create docker files
    runs-on: [ubuntu-latest]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Download artefact
        id: download-previous
        uses: actions/download-artifact@v8
        with:
          name: jar-file
          path: target
      - name: Do docker login
        id: login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with: 
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=sha
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

        