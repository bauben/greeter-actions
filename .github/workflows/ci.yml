name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened,edited]
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  ci:
    name: My CI job
    runs-on: [ubuntu-latest]
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Get version
        id: version
        run: | 
          echo "version=mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout" >> $GITHUB_OUTPUT
          echo "::notice::greeter {version} gebaut"
