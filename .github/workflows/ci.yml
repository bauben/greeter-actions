name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build:
    name: My CI job
    runs-on: [ubuntu-latest]
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Get version
        id: get-version
        run: |
          VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::greeter $VERSION gebaut"
      - name: Upload artefact
        id: upload-artefact
        uses: actions/upload-artifact@v7
        with:
          name: jar-file
          path: target/greeter.jar
          retention-days: 5
  summary:
    needs: build
    name: Summary
    runs-on: [ubuntu-latest]
    steps:
      - name: Download artefact
        id: download-artefact
        uses: actions/download-artifact@v8
        with:
          name: jar-file
      - name: Write summary
        id: write-summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          { 
            echo "Summary of the job"
            echo ""
            echo "| Variable | Wert |"
            echo "| -------- | ---- |"
            echo "| Version  | $VERSION |"
            echo "| Größe    | $(stat -c %s greeter.jar) |" 
          } >> "$GITHUB_STEP_SUMMARY"
