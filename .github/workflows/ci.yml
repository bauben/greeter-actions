name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened]
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  ci:
    name: My CI job
    runs-on: [ubuntu-latest]
    steps:
      - name: Get code
        uses: actions/checkout@7
      - name: Setup java
        uses: actions/setup-java@6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify