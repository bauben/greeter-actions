name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: [21, 25]
        os: [ubuntu-latest, windows-latest]
        exclude:
          - os: windows-latest
            java: 21
        include:
          - os: ubuntu-latest
            java: 25
            primary: true
    name: Test (${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{matrix.os}}
    steps: 
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - run: mvn -B test
      - if: matrix.primary
        env:
          JAVA: ${{ matrix.java }}
          OS: ${{ matrix.os }}
        run: |
          echo "Primärer Testlauf: Java $JAVA auf $OS" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: test
    runs-on: [ubuntu-latest]
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Get version
        id: get-version
        run: |
          VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::greeter $VERSION gebaut"
      - name: Upload artefact
        id: upload-artefact
        uses: actions/upload-artifact@v7
        with:
          name: jar-file
          path: target/greeter.jar
          retention-days: 5

  summary:
    needs: build
    name: Summary
    runs-on: [ubuntu-latest]
    steps:
      - name: Download artefact
        id: download-artefact
        uses: actions/download-artifact@v8
        with:
          name: jar-file
      - name: Write summary
        id: write-summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          { 
            echo "Summary of the job"
            echo ""
            echo "| Variable | Wert |"
            echo "| -------- | ---- |"
            echo "| Version  | $VERSION |"
            echo "| Größe    | $(stat -c %s greeter.jar) |" 
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: build
    name: Create docker files
    runs-on: [ubuntu-latest]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Download artefact
        id: download-previous
        uses: actions/download-artifact@v8
        with:
          name: jar-file
          path: target
      - name: Do docker login
        id: login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with: 
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=sha
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  smoke-test:
    needs: [build,docker]
    uses: ./.github/workflows/smoke-test.yml
    with:
      image-tag: ${{ needs.build.outputs.version }}
  
        