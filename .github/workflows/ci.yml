name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: [21, 25]
        os: [ubuntu-latest, windows-latest]
        exclude:
          - os: windows-latest
            java: 21
        include:
          - os: ubuntu-latest
            java: 25
            primary: true
    name: Test (${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{matrix.os}}
    steps: 
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Run mvn action ${{ matrix.java }}
        uses: ./.github/actions/maven
        with:
          java-version: '${{ matrix.java }}'
          goal: 'test'
      - if: matrix.primary
        env:
          JAVA: ${{ matrix.java }}
          OS: ${{ matrix.os }}
        run: |
          echo "Primärer Testlauf: Java $JAVA auf $OS" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: test
    runs-on: [ubuntu-latest]
    outputs:
      version: ${{ steps.runMvnAction.outputs.version }}
    steps:
      - name: Get code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Run mvn action
        id: runMvnAction
        uses: ./.github/actions/maven
        with:
          java-version: '21'
      - name: Upload artefact
        id: upload-artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: jar-file
          path: target/greeter.jar
          retention-days: 5

  summary:
    needs: build
    name: Summary
    runs-on: [ubuntu-latest]
    steps:
      - name: Download artefact
        id: download-artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: jar-file
      - name: Write summary
        id: write-summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          { 
            echo "Summary of the job"
            echo ""
            echo "| Variable | Wert |"
            echo "| -------- | ---- |"
            echo "| Version  | $VERSION |"
            echo "| Größe    | $(stat -c %s greeter.jar) |" 
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: build
    name: Create docker files
    runs-on: [ubuntu-latest]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Download artefact
        id: download-previous
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: jar-file
          path: target
      - name: Do docker login
        id: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
        with: 
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=sha
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  smoke-test:
    needs: [build,docker]
    uses: ./.github/workflows/smoke-test.yml
    with:
      image-tag: ${{ needs.build.outputs.version }}
  
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 #v4.3.0
      - id: hadolint
        uses: ./.github/actions/hadolint
      - if: always()
        env:
          FINDINGS: ${{ steps.hadolint.outputs.findings }}
        run: |
          echo "Hadolint: $FINDINGS Befunde" >> "$GITHUB_STEP_SUMMARY"
        