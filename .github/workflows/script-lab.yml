name: Script Lab

on:
    workflow_dispatch:

permissions: {}

jobs:
    lab:
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: JSON
              id: json
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                script: return "greeter"
            - name: Text
              id: text
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                result-encoding: string
                script: return "greeter"
            - name: Flaky
              id: flaky
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                script: core.setFailed("Absichtlicher Fehler");
            - name: Fallback
              if: ${{ steps.flaky.conclusion == 'failure' }}
              run: echo "Fallback läuft" >> "$GITHUB_STEP_SUMMARY"
            - name: Table
              env:
                RESULT_JSON: ${{ steps.json.outputs.result }}
                RESULT_TEXT: ${{ steps.json.outputs.result }}
                FLAKY_OUTCOME: ${{ steps.flaky.outcome }}
                FLAKY_CONCLUSION: ${{ steps.json.conclusion }}
              run: |
                {
                    echo "| Wert | Inhalt |"
                    echo "| ---- | ------ |"
                    echo "| RESULT_JSON | $RESULT_JSON |"
                    echo "| RESULT_TEXT | $RESULT_TEXT |"
                    echo "| FLAKY_OUTCOME | $FLAKY_OUTCOME |"
                    echo "| FLAKY_CONCLUSION | $FLAKY_CONCLUSION |"
                } >> "$GITHUB_STEP_SUMMARY"

            

