name: OIDC-CLAIMS

on:
  workflow_dispatch:

permissions:
    id-token: write

jobs:
    ohne-environment:
        runs-on: ubuntu-latest
        steps:
            - name: Claims anzeigen
              run: |
                TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lektion-11" | jq -r .value)
                echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | jq -R '@base64d | fromjson | {sub, aud, ref, environment, job_workflow_ref}'

    mit-environment:
        runs-on: ubuntu-latest
        environment:
            name: production
        steps:
            - name: Claims anzeigen
              run: |
                TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lektion-11" | jq -r .value)
                echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | jq -R '@base64d | fromjson | {sub, aud, ref, environment, job_workflow_ref}'
