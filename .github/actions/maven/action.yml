name: Maven
description: 'Setup java and do maven check'
author: 'Ben'
inputs:
  java-version:
    description: 'Java version to use'
    default: '25'
  goal:
    description: 'The maven goal to run'
    default: 'verify'
outputs:
  version:
    description: "Die Version aus Step 3"
    value: ${{ steps.getVersion.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Setup java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 #v6.0.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
    - name: Run maven goal
      env:
        GOAL: ${{ inputs.goal }}
      run: mvn -B "$GOAL"
      shell: bash
    - name: Read projekt version
      id: getVersion
      run: |
        VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash